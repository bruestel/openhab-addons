# add-on

addon.boschsmartcam.name = Bosch Smart Home Camera Binding
addon.boschsmartcam.description = This is the binding for the Bosch Smart Home Cameras of the second generation (Eyes Outdoor Camera II, Eyes Indoor Camera II). It talks to the cameras through their local API, an optional account adds what only the Bosch cloud can do.

# add-on config

addon.config.boschsmartcam.rtspPort.label = RTSP Port
addon.config.boschsmartcam.rtspPort.description = Port openHAB offers the streams of all cameras on, as plain RTSP and over TLS, without password. Each camera has its own address there, with its token in it. Leave empty or 0 to offer none.
addon.config.boschsmartcam.snapshotAllowedNetworks.label = Snapshot Networks
addon.config.boschsmartcam.snapshotAllowedNetworks.description = Networks that may fetch the snapshot URLs, as comma separated CIDR blocks. Defaults to loopback and the private ranges, so images stay in the local network even if a link leaks.

# thing types

thing-type.boschsmartcam.account.label = Bosch Smart Home Camera Account
thing-type.boschsmartcam.account.description = A Bosch SingleKey ID account the cameras are registered with. Has a channel group with the notifications of every camera of the account.
thing-type.boschsmartcam.camera.label = Bosch Smart Home Camera
thing-type.boschsmartcam.camera.description = A Bosch Smart Home Camera of the second generation, talked to directly through its local API. Put it under an account to switch its privacy mode.

# thing types config

thing-type.config.boschsmartcam.account.refreshInterval.label = Refresh Interval
thing-type.config.boschsmartcam.account.refreshInterval.description = Interval the account is polled in sec. Only picks up what is changed in the Bosch Smart Camera app, such as the notifications; commands from openHAB are read back right away.
thing-type.config.boschsmartcam.camera.accessToken.label = Access Token
thing-type.config.boschsmartcam.camera.accessToken.description = Token in the addresses of snapshot, streams and events. Leave empty and the binding creates one and keeps it. Enter a new one, at least 16 letters, digits, - or _, to revoke addresses that leaked.
thing-type.config.boschsmartcam.camera.host.label = Host
thing-type.config.boschsmartcam.camera.host.description = Address of the camera in the local network.
thing-type.config.boschsmartcam.camera.password.label = Password
thing-type.config.boschsmartcam.camera.password.description = Password of the local API, shown in the Bosch Smart Camera app next to the user.
thing-type.config.boschsmartcam.camera.publishEventsApi.label = Publish Events as API
thing-type.config.boschsmartcam.camera.publishEventsApi.description = Offer the events the Bosch cloud keeps for this camera, with their images and clips, as JSON at the snapshot address with events in place of snapshot.jpg. Like the snapshot it is guarded by the token in the address and the networks of the binding. Needs an account.
thing-type.config.boschsmartcam.camera.snapshotCacheSeconds.label = Snapshot Cache
thing-type.config.boschsmartcam.camera.snapshotCacheSeconds.description = How long a fetched image is reused before the camera is asked again. The number of viewers does not matter, they all share it.
thing-type.config.boschsmartcam.camera.trustAllCertificates.label = Trust All Certificates
thing-type.config.boschsmartcam.camera.trustAllCertificates.description = Accept any certificate instead of only those issued below the root Bosch publishes for the local API. Only meant as a way out should a firmware update bring a new root, the camera is not verified then.
thing-type.config.boschsmartcam.camera.user.label = User
thing-type.config.boschsmartcam.camera.user.description = User of the local API. The Bosch Smart Camera app shows it once the local data interface is enabled (camera settings, More, Local Data Interface).

# channel group types

channel-group-type.boschsmartcam.alarm.label = Alarm
channel-group-type.boschsmartcam.alarm.description = Siren and alarms of the camera. Read from the camera; switching the siren needs an account.
channel-group-type.boschsmartcam.cloud.label = Cloud
channel-group-type.boschsmartcam.cloud.description = What the Bosch cloud keeps of the events of the camera. Needs an account.
channel-group-type.boschsmartcam.light.label = Light
channel-group-type.boschsmartcam.light.description = The lights of the Eyes Outdoor Camera II. Added with an account, which tells the model and switches them; the state is reported by the camera itself.
channel-group-type.boschsmartcam.local.label = Camera
channel-group-type.boschsmartcam.local.description = What the camera reports itself, available without an account.
channel-group-type.boschsmartcam.notifications.label = App Push Notifications
channel-group-type.boschsmartcam.notifications.description = Push notifications of one camera to the Bosch Smart Camera app on the phones of this account.

# channel types

channel-type.boschsmartcam.camera-rtsps-url.label = Camera RTSPS URL (direct)
channel-type.boschsmartcam.camera-rtsps-url.description = Address of the stream directly at the camera, with TLS. The player has to accept a certificate that names the MAC address of the camera instead of its host, and logs in with the user and password of the camera.
channel-type.boschsmartcam.clip-ready.label = Clip Ready
channel-type.boschsmartcam.clip-ready.description = Fires when the clip of an event is in the cloud, with the kind of the event as payload.
channel-type.boschsmartcam.event.label = Event
channel-type.boschsmartcam.event.description = Fires once per event the camera detects, with its kind as payload.
channel-type.boschsmartcam.front-light.label = Front Light
channel-type.boschsmartcam.front-light.description = Switches the front light like the button in the app does. Shows ON while it shines, also when motion or dusk turned it on.
channel-type.boschsmartcam.last-clip-snapshot-url.label = Last Clip Snapshot URL
channel-type.boschsmartcam.last-clip-snapshot-url.description = Address of the still image of the last clip, as the cloud keeps it, served through openHAB. Contains the token, so treat it as a secret. Only offered while this channel is linked to an item.
channel-type.boschsmartcam.last-clip-url.label = Last Clip URL
channel-type.boschsmartcam.last-clip-url.description = Address of the video clip of the last event, served through openHAB once the camera has uploaded it. Contains the token, so treat it as a secret. Only offered while this channel is linked to an item.
channel-type.boschsmartcam.last-event-time.label = Last Event Time
channel-type.boschsmartcam.last-event-time.description = When the camera detected the last event.
channel-type.boschsmartcam.last-event.label = Last Event
channel-type.boschsmartcam.last-event.description = Kind of the event the camera detected last.
channel-type.boschsmartcam.last-event.state.option.PERSON = Person
channel-type.boschsmartcam.last-event.state.option.INTRUSION = Intrusion
channel-type.boschsmartcam.last-event.state.option.NOISE = Noise
channel-type.boschsmartcam.last-event.state.option.GLASSBREAK = Glass Break
channel-type.boschsmartcam.last-event.state.option.FIRE = Fire Alarm
channel-type.boschsmartcam.last-event.state.option.WATER = Water Alarm
channel-type.boschsmartcam.motion-light.label = Light on Motion
channel-type.boschsmartcam.motion-light.description = Whether the lights go on when the camera detects motion, as set in the app. A change made in the app shows up with the next poll of the account.
channel-type.boschsmartcam.notifications-status.label = App Push Status
channel-type.boschsmartcam.notifications-status.description = The push setting as the Bosch cloud reports it, e.g. ON_CAMERA_SCHEDULE after switching on in openHAB, OFF_OVERRIDE after switching off, or ALWAYS_OFF. Everything starting with OFF means no push notifications.
channel-type.boschsmartcam.notifications.label = App Push Notifications
channel-type.boschsmartcam.notifications.description = Whether the Bosch Smart Camera app sends push notifications for this camera to the phones of this account. ON follows the schedule set in the app. A change made in the app shows up with the next poll of the account.
channel-type.boschsmartcam.privacy-mode.label = Privacy Mode
channel-type.boschsmartcam.privacy-mode.description = ON puts the camera into privacy mode: it stops watching and recording, the Eyes Indoor Camera II also lowers its lens into the housing, so it cannot see at all. The state is read from the camera itself and works without an account. Switching needs the camera under an authorized account: the local API can only read the privacy mode, so openHAB switches it through the Bosch cloud. Without an account a command is ignored and the switch returns to what the camera reports.
channel-type.boschsmartcam.recording.label = Recording
channel-type.boschsmartcam.recording.description = ON while the camera records a clip of an event.
channel-type.boschsmartcam.rtsp-substream-url.label = RTSP Substream URL
channel-type.boschsmartcam.rtsp-substream-url.description = Like the RTSP URL, but the small stream without sound (704×400), the one a video recorder detects motion on. Contains the token, so treat it as a secret.
channel-type.boschsmartcam.rtsp-url.label = RTSP URL
channel-type.boschsmartcam.rtsp-url.description = Address of the stream through openHAB as plain RTSP, without TLS and without password: the token in the address stands in for it, so treat it as a secret. Only set when the RTSP port of the binding is configured. Plain streams are only offered while this or the RTSP substream URL is linked to an item.
channel-type.boschsmartcam.rtsps-substream-url.label = RTSPS Substream URL
channel-type.boschsmartcam.rtsps-substream-url.description = Like the RTSPS URL, but the small stream without sound (704×400). Contains the token, so treat it as a secret.
channel-type.boschsmartcam.rtsps-url.label = RTSPS URL
channel-type.boschsmartcam.rtsps-url.description = Address of the stream through openHAB over TLS, without password: the token in the address stands in for it, so treat it as a secret. openHAB shows the certificate it serves HTTPS with, see the thing properties. Only set when the RTSP port of the binding is configured. Streams over TLS are only offered while this or the RTSPS substream URL is linked to an item.
channel-type.boschsmartcam.siren.label = Siren
channel-type.boschsmartcam.siren.description = ON sounds the siren of the camera until it is switched off or the alarm time set in the app has passed. Shows ON while the camera sounds any alarm. Switching needs an account.
channel-type.boschsmartcam.snapshot-url.label = Snapshot URL
channel-type.boschsmartcam.snapshot-url.description = Address a still image of this camera can be fetched from. Contains a token, so treat it as a secret. The image is only offered while this channel is linked to an item.
channel-type.boschsmartcam.top-bottom-light.label = Top and Bottom Light
channel-type.boschsmartcam.top-bottom-light.description = Switches the LEDs on top of and below the camera together, like the button in the app does. Shows ON while either shines, also when motion or dusk turned them on.

