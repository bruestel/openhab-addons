# add-on

addon.boschsmartcam.name = Bosch Smart Home Camera Binding
addon.boschsmartcam.description = This is the binding for the Bosch Smart Home Cameras (Eyes outdoor camera, 360° indoor camera). They are not connected through the Smart Home Controller but through Bosch's camera cloud, so this binding is separate from the Bosch Smart Home binding.

# thing types

thing-type.boschsmartcam.account.label = Bosch Smart Home Camera Account
thing-type.boschsmartcam.account.description = A Bosch SingleKey ID account the cameras are registered with.
thing-type.boschsmartcam.camera.label = Bosch Smart Home Camera
thing-type.boschsmartcam.camera.description = A Bosch Smart Home Camera (Eyes outdoor camera, 360° indoor camera).

# thing types config

thing-type.config.boschsmartcam.account.refreshInterval.label = Refresh Interval
thing-type.config.boschsmartcam.account.refreshInterval.description = Interval the camera settings are polled from the Bosch cloud in sec. Only relevant for changes made outside of openHAB.
thing-type.config.boschsmartcam.camera.cameraId.label = Camera ID
thing-type.config.boschsmartcam.camera.cameraId.description = ID of the camera as used by the Bosch cloud.
thing-type.config.boschsmartcam.camera.snapshotCacheSeconds.label = Snapshot Cache
thing-type.config.boschsmartcam.camera.snapshotCacheSeconds.description = How long a fetched image is reused before the camera is asked again. The number of viewers does not matter, they all share it.
thing-type.config.boschsmartcam.account.snapshotAllowedNetworks.label = Snapshot Networks
thing-type.config.boschsmartcam.account.snapshotAllowedNetworks.description = Networks that may fetch the snapshot URLs, as comma separated CIDR blocks. Defaults to loopback and the private ranges, so images stay in the local network even if a link leaks.

# channel types

channel-type.boschsmartcam.privacy-mode.label = Privacy Mode
channel-type.boschsmartcam.privacy-mode.description = ON switches the camera off, the 360° indoor camera closes its shutter.
channel-type.boschsmartcam.notifications.label = Notifications
channel-type.boschsmartcam.notifications.description = Push notifications of this camera to the Bosch app.
channel-type.boschsmartcam.snapshot-url.label = Snapshot URL
channel-type.boschsmartcam.snapshot-url.description = Address a still image of this camera can be fetched from. Contains a token, so treat it as a secret.
channel-type.boschsmartcam.notifications-status.label = Notifications Status
channel-type.boschsmartcam.notifications-status.description = Notification setting as the cloud reports it, e.g. FOLLOW_CAMERA_SCHEDULE or ALWAYS_OFF.
channel-type.boschsmartcam.status.label = Connection Status
channel-type.boschsmartcam.status.description = Connection state the Bosch cloud reports for this camera.

# thing status descriptions

offline.conf-error.not-authorized = Please authorize your account at http(s)://[YOUROPENHAB]:[YOURPORT]{0} (e.g. http://192.168.178.100:8080{0}) by logging in with your Bosch SingleKey ID.
offline.conf-error.no-camera-id = The camera ID is missing.
offline.camera-not-in-account = This camera is not part of the account any more.
offline.camera-not-reachable = The Bosch cloud cannot reach this camera.
offline.camera-updating = The camera is installing a firmware update.
