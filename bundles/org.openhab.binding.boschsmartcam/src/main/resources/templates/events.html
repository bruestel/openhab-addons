<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>${label}</title>
<style>
:root { color-scheme: light dark; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 2rem 1rem; background: #f5f6f8; color: #22262b; }
@media (prefers-color-scheme: dark) { body { background: #17191c; color: #e6e8ea; } }
main { max-width: 46rem; margin: 0 auto; }
h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
h2 { font-size: 1.1rem; margin: 0 0 .75rem; }
.card { background: #fff; border: 1px solid #dcdfe3; border-radius: .6rem; padding: 1.25rem; margin: 1rem 0; }
@media (prefers-color-scheme: dark) { .card { background: #22262b; border-color: #383d43; } }
.head { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.badge { font-size: .75rem; padding: .15rem .5rem; border-radius: 1rem; border: 1px solid transparent; }
.badge.ok { background: #e3f6e8; border-color: #7fc99a; color: #1d6b38; }
.badge.pending { background: #fdf1dc; border-color: #e0b567; color: #7d5410; }
img.snapshot { width: 100%; height: auto; border-radius: .4rem; background: rgba(127,127,127,.15); min-height: 8rem; display: block; }
button { font: inherit; cursor: pointer; border-radius: .4rem; border: 1px solid #9aa0a6; background: transparent; color: inherit; padding: .35rem .8rem; margin-top: .6rem; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: .45rem .4rem; border-bottom: 1px solid #dcdfe3; }
@media (prefers-color-scheme: dark) { th, td { border-color: #383d43; } }
th { font-weight: 600; opacity: .8; }
td.clip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
tr.new td { animation: flash 2s ease-out; }
@keyframes flash { from { background: rgba(31,111,208,.25); } to { background: transparent; } }
.empty { opacity: .8; }
</style>
</head>
<body>
<main>
<div class="head">
  <h1>${label}</h1>
  <span class="badge pending" id="live">connecting</span>
</div>

<section class="card">
  <h2>Snapshot</h2>
  <img class="snapshot" id="snapshot" src="${snapshotFile}" alt="Still image of the camera">
  <button type="button" id="reload">Reload</button>
</section>

<section class="card">
  <h2>Events</h2>
  <table>
    <thead><tr><th>Detected</th><th>Kind</th><th>Recording</th><th>Clip</th></tr></thead>
    <tbody id="events">${rows}</tbody>
  </table>
  <p class="empty" id="empty"${emptyHidden}>No events since openHAB started.</p>
</section>
</main>
<script>
(function () {
  var KINDS = { PERSON: 'Person', INTRUSION: 'Intrusion', NOISE: 'Noise', GLASSBREAK: 'Glass break', FIRE: 'Fire alarm', WATER: 'Water alarm' };
  var MAX_ROWS = ${capacity};
  var body = document.getElementById('events');

  function time(iso) { return iso ? new Date(iso).toLocaleString() : ''; }

  function recording(event) {
    if (!event.clipId) { return '-'; }
    return event.recordingEnd ? 'until ' + new Date(event.recordingEnd).toLocaleTimeString() : 'recording';
  }

  function fill(row, event) {
    row.dataset.key = event.clipId ? event.kind + '/' + event.clipId : event.kind + '@' + event.time;
    row.dataset.time = event.time;
    row.cells[0].textContent = time(event.time);
    row.cells[1].textContent = KINDS[event.kind] || event.kind;
    row.cells[2].textContent = recording(event);
    row.cells[3].textContent = event.clipId || '';
  }

  function show(event) {
    var key = event.clipId ? event.kind + '/' + event.clipId : event.kind + '@' + event.time;
    var row = body.querySelector('tr[data-key="' + CSS.escape(key) + '"]');
    if (!row) {
      row = body.insertRow(0);
      for (var i = 0; i < 4; i++) { row.insertCell(); }
      row.cells[3].className = 'clip';
      row.className = 'new';
      while (body.rows.length > MAX_ROWS) { body.deleteRow(body.rows.length - 1); }
    }
    fill(row, event);
    document.getElementById('empty').hidden = true;
  }

  // rows rendered by the server carry the raw values, the browser formats them in its own time zone
  Array.prototype.forEach.call(body.rows, function (row) {
    fill(row, { time: row.dataset.time, kind: row.dataset.kind, clipId: row.dataset.clip || null, recordingEnd: row.dataset.end || null });
  });

  document.getElementById('reload').addEventListener('click', function () {
    document.getElementById('snapshot').src = '${snapshotFile}?t=' + Date.now();
  });

  var live = document.getElementById('live');
  var source = new EventSource('${streamFile}');
  source.onopen = function () { live.textContent = 'live'; live.className = 'badge ok'; };
  source.onerror = function () { live.textContent = 'reconnecting'; live.className = 'badge pending'; };
  source.onmessage = function (message) { show(JSON.parse(message.data)); };
})();
</script>
</body>
</html>
