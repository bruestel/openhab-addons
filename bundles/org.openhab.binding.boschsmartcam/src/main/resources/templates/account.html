<section class="card">
  <div class="head">
    <h2>${account.label}</h2>
    <span class="badge ${account.stateClass}">${account.stateText}</span>
  </div>
  <p class="uid">${account.uid}</p>
  <ol>
    <li>
      <a class="button" href="${account.authorizationUrl}" target="_blank" rel="noopener">Log in with Bosch SingleKey ID</a>
    </li>
    <li>
      <form class="authorize" method="post" action="">
        <input type="hidden" name="thingUid" value="${account.uid}">
        <label for="url-${account.uid}">Paste the address you were redirected to:</label>
        <textarea id="url-${account.uid}" name="redirectUrl" spellcheck="false" placeholder="https://my.home-assistant.io/redirect/oauth?code=...&amp;state=..."></textarea>
        <p><button type="submit">Complete authorization</button></p>
      </form>
    </li>
  </ol>
  <form method="post" action="">
    <input type="hidden" name="thingUid" value="${account.uid}">
    <input type="hidden" name="action" value="deauthorize">
    <button type="submit" class="secondary">Remove stored tokens</button>
  </form>
</section>
